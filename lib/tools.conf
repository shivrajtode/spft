# SP Flash Tool downloads for `spft tool`.
#
# One line per download address:   NAME   SHA256 (or - when none is known)   URL
#
#  * `spft tool` installs the FIRST name in this file. `spft tool NAME` installs another one.
#  * Several lines with the same NAME are alternatives, tried from top to bottom.
#  * A SHA256 makes the download strict: a file with another checksum is thrown away. With "-" the file is
#    still checked (valid zip, contains the tool, 64-bit x86 program) and its checksum is printed.
#
# SP Flash Tool is MediaTek's program; as far as we know MediaTek has no public download page for it. These addresses belong to
# spflashtools.com, an unofficial site that hosts the zips (its own footer says it is not affiliated with
# MediaTek). The site lists every file under two hosts, spflashtools.com and cdn.spflashtools.com, and its
# server wants a Referer header, which spft sends. The checksums are the ones the Arch Linux packages
# "spflashtool5-bin" and "spflashtool-bin" recorded for the same file names.
# If the site ever re-packs a file you will get a "checksum mismatch": download the zip yourself from
#   https://spflashtools.com/category/linux
# put it in your Download folder and run `spft tool` again (or `spft tool /path/to/file.zip`).
#
